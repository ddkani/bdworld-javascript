<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer & Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Timer & Stopwatch</h1>
        
        <div class="tabs">
            <button class="tab-btn active" data-tab="timer">타이머</button>
            <button class="tab-btn" data-tab="stopwatch">스톱워치</button>
            <button class="tab-btn" data-tab="pomodoro">포모도로</button>
        </div>
        
        <div id="timer" class="tab-content active">
            <div class="timer-display">
                <svg class="progress-ring" width="250" height="250">
                    <circle class="progress-ring__circle" stroke="#4a5568" stroke-width="8" fill="transparent" r="116" cx="125" cy="125"/>
                    <circle id="timerProgress" class="progress-ring__circle progress" stroke="#667eea" stroke-width="8" fill="transparent" r="116" cx="125" cy="125"/>
                </svg>
                <div class="time-text" id="timerDisplay">00:00:00</div>
            </div>
            
            <div class="timer-inputs">
                <div class="input-group">
                    <label>시간</label>
                    <input type="number" id="hoursInput" min="0" max="23" value="0">
                </div>
                <div class="input-group">
                    <label>분</label>
                    <input type="number" id="minutesInput" min="0" max="59" value="0">
                </div>
                <div class="input-group">
                    <label>초</label>
                    <input type="number" id="secondsInput" min="0" max="59" value="0">
                </div>
            </div>
            
            <div class="preset-buttons">
                <button class="preset-btn" data-time="60">1분</button>
                <button class="preset-btn" data-time="300">5분</button>
                <button class="preset-btn" data-time="600">10분</button>
                <button class="preset-btn" data-time="1800">30분</button>
            </div>
            
            <div class="control-buttons">
                <button id="timerStart" class="btn-primary">시작</button>
                <button id="timerPause" class="btn-secondary" disabled>일시정지</button>
                <button id="timerReset" class="btn-danger">리셋</button>
            </div>
        </div>
        
        <div id="stopwatch" class="tab-content">
            <div class="stopwatch-display">
                <div class="time-display" id="stopwatchDisplay">00:00:00.00</div>
            </div>
            
            <div class="control-buttons">
                <button id="stopwatchStart" class="btn-primary">시작</button>
                <button id="stopwatchPause" class="btn-secondary" disabled>일시정지</button>
                <button id="stopwatchLap" class="btn-info" disabled>랩</button>
                <button id="stopwatchReset" class="btn-danger">리셋</button>
            </div>
            
            <div class="lap-times">
                <h3>랩 타임</h3>
                <ul id="lapList"></ul>
            </div>
        </div>
        
        <div id="pomodoro" class="tab-content">
            <div class="pomodoro-display">
                <div class="session-info">
                    <span id="sessionType">작업 시간</span>
                    <span id="sessionCount">세션 #1</span>
                </div>
                <div class="time-display" id="pomodoroDisplay">25:00</div>
            </div>
            
            <div class="pomodoro-settings">
                <div class="setting-group">
                    <label>작업 시간 (분)</label>
                    <input type="number" id="workTime" min="1" max="60" value="25">
                </div>
                <div class="setting-group">
                    <label>휴식 시간 (분)</label>
                    <input type="number" id="breakTime" min="1" max="30" value="5">
                </div>
            </div>
            
            <div class="control-buttons">
                <button id="pomodoroStart" class="btn-primary">시작</button>
                <button id="pomodoroPause" class="btn-secondary" disabled>일시정지</button>
                <button id="pomodoroReset" class="btn-danger">리셋</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
